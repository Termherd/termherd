[package]
name = "termherd-scan"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
termherd-core = { path = "../core" }
termherd-claude = { path = "../claude" }
tracing = "0.1"
notify = "8.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Captures what the watch logs, so the error path is asserted, not assumed.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints]
workspace = true
