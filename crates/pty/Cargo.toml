[package]
name = "termherd-pty"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
termherd-core = { path = "../core" }
termherd-claude = { path = "../claude" }
termherd-private-fs = { path = "../private-fs" }
tracing = "0.1"

# The ConPTY job and its start time are read off the process tree
# (`status::win_process`), which only Win32 exposes.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
