name: Deploy docs

# The book is built on every PR by ci.yml's `book` job, which is what validates
# SUMMARY.md against the files on disk. This workflow only publishes what `main`
# already proved buildable.
on:
  push:
    branches: [main]
    paths:
      - 'docs/book.toml'
      - 'docs/src/**'
      - 'docs/theme/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# Least privilege by default; the deploy job widens it for itself only.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs (version in the trailing
# comment), same rule as ci.yml. Bump the SHA and the comment together; never
# use a mutable tag.
jobs:
  build:
    name: build the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2.79.7
        with:
          tool: mdbook
      - run: mdbook build docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
