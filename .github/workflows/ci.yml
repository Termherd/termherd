# Quality gate pipeline. Full reference & rationale: docs/CI.md.
name: CI

on:
  push:
    branches: [main]
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs; key non-PR runs by SHA so merges on main never
# queue behind cross-os or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
      cargo: ${{ steps.filter.outputs.cargo == 'true' || github.event_name == 'workflow_dispatch' }}
      markdown: ${{ steps.filter.outputs.markdown == 'true' || github.event_name == 'workflow_dispatch' }}
      book: ${{ steps.filter.outputs.book == 'true' || github.event_name == 'workflow_dispatch' }}
      roadmap: ${{ steps.filter.outputs.roadmap == 'true' || github.event_name == 'workflow_dispatch' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/proptest-regressions/**'
              - 'THIRD_PARTY_NOTICES.md'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'scripts/check-module-boundaries.sh'
              - 'scripts/check-os-cfg-containment.sh'
              - 'scripts/report-file-length.sh'
              - '.github/workflows/ci.yml'
            cargo:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'scripts/check-crate-deps.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/codeql.yml'
            markdown:
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'
            book:
              - 'docs/book.toml'
              - 'docs/src/**'
              - 'docs/theme/**'
            roadmap:
              - '.roadmap/**'
              - 'ROADMAP.md'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  fmt:
    name: rustfmt & arch
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: |
          cargo fmt --all --check
          ./scripts/check-module-boundaries.sh
          ./scripts/check-os-cfg-containment.sh
          ./scripts/report-file-length.sh

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2.79.7
        with:
          tool: nextest
      - run: cargo nextest run --workspace

  # Non-GUI crates on Windows for PRs; also runs on push→main when Cargo files
  # change to keep its feature-scoped Windows rust-cache warm.
  portable:
    name: portable (windows)
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.cargo == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2.79.7
        with:
          tool: nextest
      - run: cargo clippy --workspace --exclude termherd-app --all-targets -- -D warnings
      - run: cargo nextest run --workspace --exclude termherd-app

  # Post-merge and release-tag full-workspace coverage on macOS and Windows.
  cross-os:
    name: cross-os (${{ matrix.os }})
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.rust == 'true' || github.ref_type == 'tag')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2.79.7
        with:
          tool: nextest
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace

  cargo:
    name: cargo-checks
    needs: changes
    if: needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2.79.7
        with:
          tool: cargo-deny,cargo-machete@0.9.2
      - run: |
          cargo deny check
          cargo machete
          ./scripts/check-crate-deps.sh

  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_OPTS: --severity=warning # Ignore SC2086/SC2129 in dist-generated release.yml
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run actionlint
        env:
          ACTIONLINT_SHA: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
          DOWNLOADER_SHA256: 72fa3e45ac20f3c3a512d6747b4fcf719e21f890e8c43e78d48a41fdfb900c4e
        run: |
          curl -fsSL -o download-actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_SHA}/scripts/download-actionlint.bash"
          echo "${DOWNLOADER_SHA256}  download-actionlint.bash" | sha256sum --check --status
          bash download-actionlint.bash 1.7.12
          ./actionlint -color

  roadmap:
    name: roadmap
    needs: changes
    if: needs.changes.outputs.roadmap == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate and diff ROADMAP.md
        env:
          ARCHIVE: roadmark-x86_64-unknown-linux-gnu.tar.xz
          SHA256: ce8cc389868013c433d8c1dfe5f8c3723339c6b0f70e5bba48d9f9b91f451502
        run: |
          curl -fsSL -o "/tmp/${ARCHIVE}" \
            "https://github.com/bastien-gallay/roadmark/releases/download/v0.8.1/${ARCHIVE}"
          echo "${SHA256}  /tmp/${ARCHIVE}" | sha256sum --check --status
          tar -xJf "/tmp/${ARCHIVE}" --strip-components=1 -C /tmp roadmark-x86_64-unknown-linux-gnu/roadmark
          /tmp/roadmark validate
          /tmp/roadmark generate -o /tmp/ROADMAP.expected.md
          if ! diff -u ROADMAP.md /tmp/ROADMAP.expected.md; then
            echo "::error file=ROADMAP.md::ROADMAP.md is stale — run \`just roadmap\` and commit the result."
            exit 1
          fi

  markdown:
    name: markdownlint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23
        with:
          globs: '**/*.md'
          config: '.markdownlint-cli2.jsonc'

  book:
    name: mdbook
    needs: changes
    if: needs.changes.outputs.book == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2.79.7
        with:
          tool: mdbook
      - run: mdbook build docs

  # Single required status check for `main` branch protection.
  ci-success:
    name: ci-success
    if: always()
    needs: [changes, fmt, clippy, test, portable, cargo, actionlint, markdown, roadmap, book]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required CI jobs failed or were cancelled."
          exit 1
