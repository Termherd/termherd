# GUI desktop installer bundles (cargo-packager), attached to the GitHub
# Release created by release.yml. Full reference: docs/CI.md §3.
name: Package

permissions:
  contents: write

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: {}

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            formats: app,dmg
          - target: x86_64-apple-darwin
            runner: macos-14
            formats: app,dmg
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            formats: deb,appimage
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            formats: nsis # WiX/MSI rejects `-prerelease.N` version suffixes
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libfuse2 file

      - uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2.79.7
        with:
          tool: cargo-binstall
      - run: cargo binstall -y cargo-packager@0.11.8
      - run: cargo build --release --target ${{ matrix.target }} -p termherd-app

      - name: Package installers
        run: >
          cargo packager -p termherd-app --release
          --target ${{ matrix.target }}
          --formats ${{ matrix.formats }}
          --out-dir "${{ github.workspace }}/dist"
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.app/**
            dist/*.deb
            dist/*.AppImage
            dist/*.msi
            dist/*.exe
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(dist/*.dmg dist/*.deb dist/*.AppImage dist/*.msi dist/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer artifacts to upload for ${{ matrix.target }}" >&2
            exit 1
          fi
          for i in $(seq 1 40); do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber
              exit 0
            fi
            echo "Release $tag not ready yet (attempt $i/40); sleeping 30s…"
            sleep 30
          done
          echo "Release $tag never appeared; bundles remain as workflow artifacts." >&2
          exit 1
